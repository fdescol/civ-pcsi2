<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planning PCSI2 — CIV</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-top">
      <h1>Planning PCSI2</h1>
      <div class="header-ics">
        <button id="btn-ics-week" title="Exporter cette semaine en .ics">📥 Sem.</button>
        <button id="btn-ics-all"  title="Exporter toute l'année en .ics">📥 Année</button>
      </div>
    </div>
    <div class="search-wrapper">
      <input
        id="student-search"
        type="text"
        placeholder="Rechercher un étudiant…"
        autocomplete="off"
        aria-label="Rechercher un étudiant"
        aria-autocomplete="list"
        aria-controls="suggestions"
      />
      <button id="btn-clear-search" aria-label="Vider la recherche" hidden>&#x2715;</button>
      <ul id="suggestions" role="listbox" aria-label="Suggestions"></ul>
    </div>
    <p id="disclaimer-inline">⚠ Seul le colloscope officiel fait foi — vérifiez horaires et salles.</p>
  </header>

  <section id="student-info" hidden>
    <span id="student-name"></span>
    <span id="student-meta"></span>
  </section>

  <nav id="week-nav" hidden>
    <button id="btn-prev" aria-label="Semaine précédente">&#8592;</button>
    <select id="week-select" aria-label="Choisir une semaine"></select>
    <button id="btn-next" aria-label="Semaine suivante">&#8594;</button>
  </nav>

  <div id="view-toggle" hidden>
    <button id="btn-view-type" class="view-btn active" aria-pressed="true">Par type</button>
    <button id="btn-view-day"  class="view-btn"        aria-pressed="false">Par jour</button>
  </div>

  <main id="schedule"></main>

  <footer id="export-bar" hidden></footer>

  <noscript>
    <p style="text-align:center;padding:2rem">JavaScript est requis pour afficher le planning.</p>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
